<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>open-task</title>
  <!-- The logo drawn for 16 px. The spike is a wide zigzag with no lead-in: any
       narrower and its two strokes merge into a plus sign at this size. See
       open-task.svg. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0A5FC0"/>
      <stop offset="1" stop-color="#4CC6FF"/>
    </linearGradient>
  </defs>
  <path d="M 12.29 4.40 A 5.6 5.6 0 1 0 12.29 11.60" fill="none" stroke="url(#ring)" stroke-width="2" stroke-linecap="round"/>
  <polyline points="4.6,8.5 6.4,4.6 9.4,12 11,8.5 13.4,8.5" fill="none" stroke="#FF9A3C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="14.4" cy="8.5" r="1.35" fill="#FF9A3C"/>
</svg>
