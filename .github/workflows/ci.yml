name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build
        run: cargo build --target ${{ matrix.target }} -p ot-app
      - name: Headless smoke run
        # --headless is mandatory here: without it the Windows build opens its window
        # and runs the message loop until the job times out. The step-level timeout is
        # the portable guard (macOS has no GNU `timeout`). Exit 3 means "no probe on
        # this platform yet", which is expected only on macOS, still a stub; Windows
        # must measure. (Linux has its own job below.)
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          cargo run --target ${{ matrix.target }} -- --version || exit 1
          cargo run --target ${{ matrix.target }} -- --headless --passes 2
          code=$?
          set -e
          if [ "$code" = "0" ]; then exit 0; fi
          if [ "$code" = "3" ] && [[ "${{ matrix.target }}" == *apple* ]]; then exit 0; fi
          echo "unexpected exit code $code"; exit "$code"

  linux:
    # In Ubuntu 22.04, whose GTK 4.6 and Qt 6.2 are the oldest the plugins
    # support: a call into anything newer fails to build here, not on a user's
    # machine. The GUI smoke test opens the window with each toolkit on Xvfb.
    # Both architectures a release ships: Qt and GTK can differ between them.
    name: ${{ matrix.name }} (Ubuntu 22.04)
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Git, for the checkout and the build's version
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates curl > /dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Toolkit and test packages
        run: scripts/linux-deps.sh --test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-22.04
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build with the plugins inside
        run: echo "OPEN_TASK=$(scripts/build-linux.sh)" >> "$GITHUB_ENV"
      - name: Headless and GUI smoke test
        timeout-minutes: 3
        run: scripts/linux-gui-smoke.sh "$OPEN_TASK" smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-gui-smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore
