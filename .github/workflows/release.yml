name: Release

# Pushing a tag like v1.2.3 builds every target, packages it, and publishes a GitHub
# release with checksums. The self-updater reads these releases, so the asset naming
# below is a contract: <name>-<tag>-<target>.<zip|tar.gz>, the Windows installer
# <name>-<tag>-windows-setup.exe (both architectures in one file), plus SHA256SUMS
# and SHA256SUMS.minisig.
#
# The updater trusts a release only through SHA256SUMS.minisig: a minisign signature
# of SHA256SUMS by the key whose public half is minisign.pub (compiled into the app),
# with the trusted comment "open-task <tag>". The secret key is the repository secret
# MINISIGN_SECRET_KEY; without it the publish job fails rather than ship a release
# the updater cannot verify. See plans/self-update.md.
#
# The workflow can also be run by hand for a tag that already exists, to publish or
# repair a release without moving the tag (a workflow fix after the tag was pushed,
# a runner that never came, an asset upload that failed). It checks out the tag's
# commit, so the binaries are still built from exactly the tagged source.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  BIN: open-task
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Intel macOS is cross-compiled on the Apple silicon runner. GitHub retired
          # the macos-13 label (the v0.2.0 run sat queued on it indefinitely), and the
          # remaining Intel labels are on the same path. Apple's toolchain builds both
          # architectures from either host, so this needs nothing but the Rust target.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # The build names itself with `git describe`, which needs the tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          tag="${TAG#v}"
          ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="ot-app") | .version')"
          echo "tag=$tag cargo=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match ot-app version $ver"; exit 1; }

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ot-app

      - name: Verify the binary reports the tag
        # A binary that calls itself anything else would offer itself updates it
        # already has, or miss ones it does not. Intel macOS is cross-compiled and
        # cannot run here.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          got="$("target/${{ matrix.target }}/release/${BIN}" --version)"
          echo "$got"
          [ "$got" = "open-task $TAG" ] || { echo "::error::the binary says '$got', not 'open-task $TAG'"; exit 1; }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/${BIN}" "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-pc-windows-msvc"
          path: dist
          merge-multiple: true
      - name: Unpack the Windows binaries
        shell: pwsh
        run: |
          Expand-Archive "dist/$env:BIN-$env:TAG-x86_64-pc-windows-msvc.zip" -DestinationPath unpacked
          Expand-Archive "dist/$env:BIN-$env:TAG-aarch64-pc-windows-msvc.zip" -DestinationPath unpacked
          Get-ChildItem -Recurse unpacked -File | Select-Object FullName, Length
      - name: Build installer
        # Inno Setup 6 is preinstalled on the Windows runner images; the build script
        # finds it in Program Files (x86).
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart("v")
          & ./scripts/build-installer.ps1 -Version $ver `
            -X64Exe "unpacked/$env:BIN-$env:TAG-x86_64-pc-windows-msvc/$env:BIN.exe" `
            -Arm64Exe "unpacked/$env:BIN-$env:TAG-aarch64-pc-windows-msvc/$env:BIN.exe" `
            -OutDir installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Sign the checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the MINISIGN_SECRET_KEY secret is not set; the updater could not verify this release"
            exit 1
          fi
          # Ubuntu 24.04 has minisign 0.11, the first to read a key without a
          # password (-W), which is how the key was made.
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign > /dev/null
          key="$RUNNER_TEMP/minisign.key"
          # The key was made on Windows; its line endings must not matter.
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' > "$key")
          minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig -t "open-task $TAG" < /dev/null
          rm -f "$key"
          cat SHA256SUMS.minisig
          # The secret must be the key the app trusts. (A tag from before signing
          # has no minisign.pub to check against.)
          if [ -f ../minisign.pub ]; then
            minisign -V -p ../minisign.pub -m SHA256SUMS -x SHA256SUMS.minisig
          else
            echo "::warning::no minisign.pub at $TAG; signature not checked against it"
          fi
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              $prerelease
          fi
